name: ${PR_NUMBER}

networks:
  shared_public:
    driver: bridge
    external: true

services:
  frontend:
    image: aulaapp/aula-frontend:pr-${PR_NUMBER}
    container_name: aula-frontend_pr-${PR_NUMBER}
    env_file:
      - /opt/aula/aula-frontend/.env
    environment:
      - DOCKER_AULA_BASENAME="/${PR_NUMBER}/"
      - VITE_APP_BASENAME="/${PR_NUMBER}/"
    networks:
      - shared_public
